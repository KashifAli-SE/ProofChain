[profile.default]
src      = "contracts"
test     = "test"
script   = "script"
out      = "out"
cache_path = "cache-forge"
libs     = ["lib"]
solc     = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
